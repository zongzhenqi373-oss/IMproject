// IM 通信协议定义（proto3）
// 线格式：[4B 大端包长][4B 协议类型(小端 protType)][protobuf payload]
// 协议类型常量见 client_core/include/client_core/Protocol.h（与服务端 def.h 一致）
//
// 重新生成 C++ 代码（生成物提交于 protocol/generated/，供 CMake/VS/qmake 共用）：
//   protoc --cpp_out=generated im.proto
// 注意：protoc 主版本需与各端链接的 protobuf 运行时主版本一致。

syntax = "proto3";

package im.proto;

// ---------------- 注册 ----------------
message RegisterRq {
  string nick = 1;  // UTF-8，上限见 proto::USER_NICK_LEN
  string tel = 2;
  string pass = 3;
}

message RegisterRs {
  int32 result = 1; // proto::REGISTER_SUCC / REGISTER_NICK_EXIT / REGISTER_TEL_EXIT
}

// ---------------- 登录 ----------------
message LoginRq {
  string tel = 1;
  string pass = 2;
}

message LoginRs {
  int32 userid = 1;
  int32 result = 2; // proto::LOGIN_SUCCESS / LOGIN_NOTEXIT / LOGIN_PASSERROR
}

// ---------------- 用户/好友信息 ----------------
// 登录成功后服务端逐条下发：userid == 自己 id 表示本人资料，否则为好友
message FriendInfo {
  int32 userid = 1;
  int32 iconid = 2;
  int32 status = 3;   // proto::STATUS_ONLINE / STATUS_OFFLINE
  string nick = 4;    // UTF-8
  string feeling = 5; // UTF-8
}

// ---------------- 聊天 ----------------
// 消息类型（FILE 为 M7 文件传输预留）
enum MsgType {
  TEXT = 0;
  IMAGE = 1;
  FILE = 2;
}

// C→S：我发给好友；S→C：好友发给我 / 离线消息补发（此时 myid=发送方, friid=我）
message ChatInfoRq {
  int32 myid = 1;
  int32 friid = 2;
  string msg = 3;           // TEXT 时使用，UTF-8，软上限 proto::CHAT_MSG_LEN
  MsgType type = 4;         // 消息类型
  bytes image_data = 5;     // IMAGE 时使用（压缩后字节，内联通道 ≤500KB）
  int32 image_width = 6;
  int32 image_height = 7;
  string msg_id = 8;        // 客户端生成 UUID，漫游/去重/回执关联用
  int64 ts = 9;             // 消息发送时间（秒，服务端权威时钟）。在线转发/离线补发均带回，接收方据此排序，避免用"收到时刻"导致时序错乱
  int64 seq = 10;           // 会话级单调递增序列号（服务端按 conversation 分配）。接收方按 seq 排序，保证 C2C 严格顺序、可做空洞检测
  string file_name = 11;   // type=FILE 时：文件名
  int64  file_size = 12;   // type=FILE 时：字节数
  string file_id = 13;     // type=FILE 时：服务端文件标识（=发送方 msg_id）
}

// S→C：发送结果回执（myid=接收方朋友, friid=自己）
message ChatInfoRs {
  int32 myid = 1;
  int32 friid = 2;
  int32 result = 3; // proto::CHAT_RESULT_SUCC / CHAT_RESULT_FAIL
  string msg_id = 4; // 回执关联的发送消息 id
  int64 seq = 5;     // 服务端为该消息分配的会话级 seq，发送方据此校正本地消息顺序
}

// ---------------- 添加好友 ----------------
message AddFriendRq {
  int32 myid = 1;
  string mynick = 2;  // UTF-8
  string frinick = 3; // UTF-8，要添加的好友昵称
}

message AddFriendRs {
  int32 result = 1;     // proto::ADD_FRIEND_AGREE / REJECT / OFFLINE / NOTEXIT
  int32 destid = 2;     // 请求发起人
  string destnick = 3;  // UTF-8
  int32 myid = 4;       // 回复人（被添加方）
  string mynick = 5;    // UTF-8
}

// ---------------- 下线通知 ----------------
// C→S：告知自己下线；S→C：转发给在线好友
message FriendOffline {
  int32 offlineid = 1;
}

// ---------------- 文件传输（M7） ----------------
// 独立分片协议：文件可 ≥10MB，内联会堵死信令通道。分块 ≤256KB，顺序水位线断点续传，
// 消息体卡片复用 ChatInfoRq(type=FILE)。file_id == msg_id（客户端 UUID）。

message FileOfferRq {   // 1017 C→S：发起/续传协商
  string msg_id = 1;    // 客户端 UUID，全程幂等 / 重组 key / = file_id
  int32  receiver_id = 2;
  string file_name = 3; // UTF-8
  int64  file_size = 4; // 字节
  int32  total_chunks = 5;
  string sha256 = 6;    // 整文件完整性校验（小写 hex）
}

message FileOfferRs {   // 1018 S→C
  string msg_id = 1;
  string file_id = 2;          // = msg_id
  int32  received_chunks = 3;  // 水位线 N（续传起点）
  int32  result = 4;           // proto::FILE_OFFER_OK / FILE_OFFER_TOO_LARGE
}

message FileChunkRq {   // 1019 C→S（上传）/ S→C（下载）复用
  string file_id = 1;
  int32  chunk_index = 2;
  bytes  data = 3;             // ≤256KB
}

message FileCompleteRq { // 1020 C→S：请求校验+落盘+建消息
  string file_id = 1;
  string msg_id = 2;
}

message FileProgressRs { // 1021 S→C：上传/下载进度共用
  string file_id = 1;
  int32  received_chunks = 2;
  int32  total_chunks = 3;
  int32  status = 4;          // proto::FILE_ST_*
}

message FileDownloadRq { // 1022 C→S：接收方发起/续传下载
  string file_id = 1;
  int32  from_chunk = 2;      // 续传起点 = 本地已存块数
}

// ---------------- 消息漫游（M6） ----------------
// 换设备/重装后本地库空，登录后从服务端拉回历史。独立下行通道（QoS 隔离、避免队头阻塞），
// 消息体复用 ChatInfoRq（同一张 messages 表、同一套 msg_id 去重、同一套会话 seq 排序）。

// C→S：登录后拉每会话最后一条（会话列表预览）。myid 仅占位，服务端以 session 登录态为准。
message RoamConvRq {
  int32 myid = 1;
}

// S→C：会话列表预览。每条复用 ChatInfoRq；图片消息只填 type，不带 image_data（预览只需"[图片]"文字）
message RoamConvRs {
  repeated ChatInfoRq convs = 1;
}

// C→S：拉某会话比 before_seq 更早的 limit 条。首次传极大值(拉最新)，上拉传当前已加载最小 seq。
message RoamMsgRq {
  int32 myid = 1;       // 占位，服务端以 session 登录态为准
  int32 peer_id = 2;    // 会话对端 id
  int64 before_seq = 3; // 游标：seq < before_seq
  int32 limit = 4;      // 本批数量 N
}

// S→C：会话历史分页。图片消息读盘回传完整字节（复用离线补发逻辑）。
message RoamMsgRs {
  int32 peer_id = 1;
  repeated ChatInfoRq msgs = 2; // 服务端 seq 倒序返回；客户端落地后按 seq 升序
  bool has_more = 3;            // 是否还有更早的（本批返回条数 == limit 即认为有）
  int64 min_seq = 4;           // 本批最小 seq（下次上拉游标）
}
